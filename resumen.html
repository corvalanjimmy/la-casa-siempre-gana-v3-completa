<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Resumen final</title>
<style>
  :root{--bg:#0a0e1a;--panel:#141b30;--panel2:#1c2542;--gold:#f5c542;--cyan:#3ee0e8;
        --red:#ff5470;--green:#4ade80;--text:#e8ecf5;--dim:#8a94ad}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;justify-content:center;overflow-y:auto}
  .wrap{width:100%;max-width:440px;padding:22px 18px;display:flex;flex-direction:column;min-height:100dvh}
  .logo{font-size:42px;text-align:center;margin-top:12px}
  h1{text-align:center;font-size:24px;margin:10px 0 4px}
  h1 span{color:var(--gold)}
  .sub{text-align:center;color:var(--cyan);font-size:13px;font-weight:600;margin-bottom:18px}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid #26304f;border-radius:14px;padding:14px;text-align:center}
  .stat .v{font-size:26px;font-weight:800}
  .stat .l{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.35}
  .v.gd{color:var(--gold)} .v.cy{color:var(--cyan)} .v.red{color:var(--red)} .v.gr{color:var(--green)}
  .sectionT{font-size:12.5px;font-weight:800;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin:18px 0 9px}
  .mod{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid #26304f;border-radius:13px;padding:12px;margin-bottom:8px}
  .mod .ic{font-size:24px}
  .mod .nm{flex:1;font-size:13.5px;font-weight:700}
  .mod .nm small{display:block;font-weight:500;color:var(--dim);font-size:11.5px;margin-top:2px}
  .mod .pt{font-size:14px;font-weight:800;color:var(--gold);white-space:nowrap}
  .mod.pend{opacity:.6;border-style:dashed}
  .mod.pend .pt{color:var(--dim);font-size:11.5px}
  .cierre{background:var(--panel);border:1px solid #26304f;border-radius:14px;padding:14px;font-size:13.5px;line-height:1.6;color:#c6cde0;margin-bottom:9px}
  .cierre b{color:var(--cyan)}
  .frase{text-align:center;font-size:17px;font-weight:800;color:var(--gold);line-height:1.4;margin:18px 0}
  .certbox{background:linear-gradient(135deg,#2a2410,#141b30);border:1px solid var(--gold);border-radius:16px;padding:16px;margin-top:8px}
  .certbox h3{font-size:15px;color:var(--gold);margin-bottom:7px}
  .certbox p{font-size:12.5px;color:#c6cde0;line-height:1.55}
  .certbox label{display:block;font-size:11.5px;font-weight:700;color:var(--gold);margin:12px 0 6px;letter-spacing:.3px}
  .certbox input{width:100%;background:#0d1224;border:1.5px solid #5c4a1a;border-radius:10px;padding:12px;
                 font-size:15px;color:var(--text);outline:none;font-family:inherit}
  .certbox input:focus{border-color:var(--gold)}
  .certerr{display:none;color:var(--red);font-size:12px;font-weight:700;margin-top:8px;text-align:center}
  .certprev{width:100%;border-radius:10px;margin-top:12px;display:none;border:1px solid #5c4a1a}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
  .btn-gold{background:linear-gradient(135deg,#f5c542,#e8963a);color:#1a1200}
  .btn-ghost{background:transparent;color:var(--dim);border:1px solid #2c3554;font-weight:500;font-size:14px}
  .vacio{background:var(--panel);border:1px solid #26304f;border-radius:14px;padding:18px;text-align:center;font-size:14px;color:var(--dim);line-height:1.6}
  .footer{margin-top:auto;padding-top:16px;font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
  canvas{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🏁</div>
  <h1 data-t="resumenTitulo" data-t-html></h1>
  <div class="sub" data-t="resumenSub"></div>
  <div id="contenido"></div>
  <button class="btn btn-ghost" onclick="location.href='index.html'" data-t="volverModulosBtn"></button>
  <div class="footer" id="pie"></div>
</div>
<canvas id="cert" width="1400" height="990"></canvas>

<script src="i18n.js"></script>
<script>
const MODS = [
  {k:'casino',   ic:'🎰', nom:'nombreCasino',   total:8},
  {k:'jimmybet', ic:'⚽', nom:'nombreJimmybet', total:10},
  {k:'lootbox',  ic:'💎', nom:'nombreLootbox',  total:10},
  {k:'ruleta',   ic:'🎡', nom:'nombreRuleta',   total:4}
];
function participante(){ try{ return JSON.parse(sessionStorage.getItem('participante'))||{}; }catch(e){ return {}; } }
function resultados(){ try{ return JSON.parse(sessionStorage.getItem('resultados'))||{}; }catch(e){ return {}; } }
const fmt = n => '$' + Math.round(n).toLocaleString(IDIOMA==='en'?'en-US':'es-CL');

function pintarResumen(){
  const R=resultados(), hechos=MODS.filter(m=>R[m.k]), faltan=MODS.filter(m=>!R[m.k]);
  const cont=document.getElementById('contenido');
  if(!hechos.length){
    cont.innerHTML='<div class="vacio">'+t('resumenVacio')+'</div>';
    return;
  }
  const lucidez=hechos.reduce((a,m)=>a+(R[m.k].lucidez||0),0);
  const found=hechos.reduce((a,m)=>a+(R[m.k].found||0),0);
  const totalTrampas=MODS.reduce((a,m)=>a+m.total,0);
  const perdida=hechos.reduce((a,m)=>a+(R[m.k].perdida||0),0);
  let html =
    '<div class="statgrid">'
    + '<div class="stat"><div class="v cy">'+hechos.length+'/'+MODS.length+'</div><div class="l">'+t('resumenModulos')+'</div></div>'
    + '<div class="stat"><div class="v gd">'+lucidez+'</div><div class="l">'+t('resumenLucidez')+'</div></div>'
    + '<div class="stat"><div class="v gr">'+found+'/'+totalTrampas+'</div><div class="l">'+t('resumenTrampas')+'</div></div>'
    + '<div class="stat"><div class="v red">'+fmt(perdida)+'</div><div class="l">'+t('resumenPerdido')+'</div></div>'
    + '</div>'
    + '<div class="sectionT">'+t('resumenDetalle')+'</div>';
  hechos.forEach(function(m){
    const r=R[m.k];
    html += '<div class="mod"><span class="ic">'+m.ic+'</span><div class="nm">'+t(m.nom)
      + '<small>'+r.found+'/'+r.total+' '+t('trampas')+'</small></div>'
      + '<span class="pt">'+r.lucidez+' '+t('pts')+'</span></div>';
  });
  if(faltan.length){
    html += '<div class="sectionT">'+t('resumenPendientes')+'</div>';
    faltan.forEach(function(m){
      html += '<div class="mod pend"><span class="ic">'+m.ic+'</span><div class="nm">'+t(m.nom)
        + '<small>'+m.total+' '+t('trampas')+'</small></div><span class="pt">'+t('jugar')+'</span></div>';
    });
  }
  html += '<div class="sectionT">'+t('resumenCierre')+'</div>'
    + '<div class="cierre">'+t('resumenCierre1')+'</div>'
    + '<div class="cierre">'+t('resumenCierre2')+'</div>'
    + '<div class="frase">'+t('resumenFrase')+'</div>'
    + '<div class="certbox"><h3>'+t('certificadoTitulo')+'</h3><p>'+t('certificadoTexto')+'</p>'
    + '<label for="certNombre">'+t('certNombrePregunta')+'</label>'
    + '<input id="certNombre" type="text" maxlength="46" placeholder="'+t('certPhNombre')+'" autocomplete="name" oninput="previsualizar()">'
    + '<div class="certerr" id="certErr"></div>'
    + '<img class="certprev" id="certPrev" alt="">'
    + '<button class="btn btn-gold" onclick="descargar()" id="btnCert">'+t('certificadoBtn')+'</button></div>';
  cont.innerHTML=html;
  window.__datos = {lucidez:lucidez, found:found, total:totalTrampas, mods:hechos.length};
  // precargar el nombre del registro, si lo hay
  var pn = participante().nombre;
  if(pn && document.getElementById('certNombre')){
    document.getElementById('certNombre').value = pn;
  }
  cargarLogo(function(){ previsualizar(); });
}

/* ---------- certificado ---------- */
var LOGO=null;
function cargarLogo(listo){
  var img=new Image();
  img.onload=function(){ LOGO=img; listo(); };
  img.onerror=function(){ LOGO=null; listo(); };
  img.src='logo.png';
}
function nombreCert(){
  var el=document.getElementById('certNombre');
  var v = el ? el.value.trim().replace(/\s+/g,' ') : '';
  return v;
}
function dibujarCertificado(){
  const d=window.__datos;
  const nombre = nombreCert() || t('certAnonimo');
  const c=document.getElementById('cert'), g=c.getContext('2d');
  const W=c.width, H=c.height, cx=W/2;
  g.fillStyle='#0a0e1a'; g.fillRect(0,0,W,H);
  g.strokeStyle='#f5c542'; g.lineWidth=8; g.strokeRect(34,34,W-68,H-68);
  g.strokeStyle='#3ee0e8'; g.lineWidth=2; g.strokeRect(56,56,W-112,H-112);
  g.textAlign='center';
  // logo sobre un disco claro (el original tiene fondo blanco)
  if(LOGO){
    const R=98;
    g.save();
    g.beginPath(); g.arc(cx,168,R,0,2*Math.PI); g.closePath();
    g.fillStyle='#ffffff'; g.fill();
    g.strokeStyle='#f5c542'; g.lineWidth=4; g.stroke();
    g.clip();
    const lado=R*1.86;
    g.drawImage(LOGO, cx-lado/2, 168-lado/2, lado, lado);
    g.restore();
  } else {
    g.fillStyle='#f5c542'; g.font='bold 74px Arial'; g.fillText('🔍', cx, 192);
  }
  g.fillStyle='#f5c542'; g.font='bold 58px Arial';
  g.fillText(t('certNombre'), cx, 330);
  g.fillStyle='#8a94ad'; g.font='27px Arial';
  g.fillText(t('certOtorga'), cx, 396);
  // nombre, con ajuste automático de tamaño
  let tam=64;
  g.font='bold '+tam+'px Arial';
  while(g.measureText(nombre).width > W-260 && tam>26){ tam-=2; g.font='bold '+tam+'px Arial'; }
  g.fillStyle='#e8ecf5';
  g.fillText(nombre, cx, 474);
  g.strokeStyle='#3ee0e8'; g.lineWidth=3;
  g.beginPath(); g.moveTo(cx-300,512); g.lineTo(cx+300,512); g.stroke();
  g.fillStyle='#c6cde0'; g.font='26px Arial';
  g.fillText(t('certPor'), cx, 560);
  g.fillText(t('certPor2').replace('{n}', d.found).replace('{total}', d.total), cx, 600);
  g.fillStyle='#3ee0e8'; g.font='bold 92px Arial';
  g.fillText(String(d.lucidez), cx, 716);
  g.fillStyle='#8a94ad'; g.font='bold 25px Arial';
  g.fillText(t('certPuntos'), cx, 754);
  g.fillStyle='#f5c542'; g.font='italic bold 32px Arial';
  g.fillText(t('certFrase'), cx, 836);
  const hoy=new Date();
  const fecha=String(hoy.getDate()).padStart(2,'0')+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-'+hoy.getFullYear();
  g.fillStyle='#5f6c8a'; g.font='22px Arial';
  g.fillText(t('certPie'), cx, 886);
  g.fillText(fecha + '  ·  @jimmy_exludopata', cx, 922);
}
function previsualizar(){
  if(!window.__datos) return;
  dibujarCertificado();
  const prev=document.getElementById('certPrev');
  if(prev){ prev.src=document.getElementById('cert').toDataURL('image/png'); prev.style.display='block'; }
  const err=document.getElementById('certErr'); if(err) err.style.display='none';
}
function descargar(){
  const nom=nombreCert();
  const err=document.getElementById('certErr');
  if(!nom){ err.textContent=t('certErrNombre'); err.style.display='block';
    document.getElementById('certNombre').focus(); return; }
  err.style.display='none';
  dibujarCertificado();
  const a=document.createElement('a');
  a.download = (IDIOMA==='en'?'certificate-of-clarity':'certificado-de-lucidez')+'.png';
  a.href = document.getElementById('cert').toDataURL('image/png');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  document.getElementById('btnCert').textContent = t('certificadoListo');
}
document.addEventListener('DOMContentLoaded',function(){
  pintar(); pintarResumen();
  document.getElementById('pie').innerHTML = t('pieEducativo');
  document.title = (IDIOMA==='en'?'Final summary':'Resumen final');
});
</script>
</body>
</html>
